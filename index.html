<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Agenda</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--txt:#1f2328;--suave:#6b7280;--borde:#dfe2e7;--fuera:#f9fafb;
  --acento:#3e63dd;--acento2:#3451b2;--sel:#eef2ff;--rojo:#d1242f;--rojobg:#fff1f1;--hecho:#a0a6b0;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16181d;--card:#1f2228;--txt:#e6e8eb;--suave:#9aa1ad;--borde:#2f333b;--fuera:#1a1d22;
  --sel:#262c40;--rojobg:#3a1f22;--hecho:#5d636e;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--borde);background:var(--card);color:var(--txt);border-radius:8px;padding:6px 12px}
button:hover{filter:brightness(.96)}
button.prim{background:var(--acento);border-color:var(--acento);color:#fff}
button.prim:hover{background:var(--acento2)}
button.peligro{color:var(--rojo)}
header{display:flex;align-items:center;gap:8px;padding:14px 18px;flex-wrap:wrap}
header h1{font-size:22px;margin:0 10px 0 6px;min-width:200px}
header .esp{flex:1}
.nav{width:36px;font-size:18px;padding:2px 0}
main{flex:1;display:flex;gap:16px;padding:0 18px 18px;min-height:0}
#cal{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto;gap:1px;background:var(--borde);border:1px solid var(--borde);border-radius:10px;overflow:hidden;min-width:0}
.cab{background:var(--bg);color:var(--suave);font-size:12px;font-weight:600;text-align:center;padding:6px 0}
.dia{background:var(--card);padding:4px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:0;position:relative}
.dia.fuera{background:var(--fuera)}.dia.fuera .num{color:var(--hecho)}
.dia.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--acento)}
.num{font-weight:600;font-size:13px;padding:1px 6px;align-self:flex-start;border-radius:10px}
.hoy .num{background:var(--acento);color:#fff}
.ev{color:#fff;font-size:11.5px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.hecho{background:var(--hecho)!important;text-decoration:line-through}
.mas{font-size:11px;color:var(--suave);padding-left:4px}
aside{width:350px;display:flex;flex-direction:column;gap:10px;min-height:0}
aside h2{font-size:16px;margin:4px 0 0}
.lista{background:var(--card);border:1px solid var(--borde);border-radius:10px;overflow:auto}
#listaDia{max-height:38%}
#listaProx{flex:1}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--borde);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sel)}
.punto{width:10px;height:10px;border-radius:50%;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--suave)}
.item.hecho b{text-decoration:line-through;color:var(--hecho)}
.item.urgente small{color:var(--rojo);font-weight:600}
.item.atrasado{background:var(--rojobg)}.item.atrasado small{color:var(--rojo);font-weight:600}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--borde);display:grid;place-items:center;flex:none;font-size:13px;color:#fff;background:transparent;padding:0}
.chk.on{background:#30a46c;border-color:#30a46c}
.vacio{padding:14px;color:var(--suave);text-align:center}
.pie{font-size:12px;color:var(--suave);display:flex;gap:6px;flex-wrap:wrap}
.pie button{font-size:12px;padding:4px 8px}
#aviso{display:none;margin:0 18px 12px;padding:10px 14px;border-radius:10px;background:#fff4d6;color:#6b4e00;border:1px solid #f0d58a;align-items:center;gap:10px}
#aviso.on{display:flex}
#aviso span{flex:1}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--txt);width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:20px;display:grid;gap:10px}
dialog h3{margin:0 0 4px;font-size:18px}
label{font-size:12px;color:var(--suave);display:grid;gap:4px}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--borde);border-radius:8px;padding:8px}
textarea{resize:vertical;min-height:70px}
.fila{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acciones{display:flex;gap:8px;margin-top:6px}
.acciones .esp{flex:1}
.tipos{display:flex;gap:6px;flex-wrap:wrap}
.tipos button{border-radius:20px;padding:4px 12px;font-size:13px}
.tipos button.on{color:#fff}
.rep{border:1px solid var(--borde);border-radius:8px;padding:8px 10px;display:grid;gap:8px}
.chkl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt);cursor:pointer}
.chkl input{width:16px;height:16px;margin:0}
.dsem{display:flex;gap:5px;flex-wrap:wrap}
.dsem button{width:36px;height:34px;padding:0;border-radius:50%;font-weight:600;font-size:13px}
.dsem button.on{background:var(--acento);border-color:var(--acento);color:#fff}
.dias-sel{display:grid;gap:4px;font-size:12px;color:var(--suave)}
.rec{opacity:.85;font-size:.9em;margin-right:3px}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:16px}
.login[hidden]{display:none}
.login-card{background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:26px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.login-card h2{margin:0;font-size:24px}
.login-card .sub{margin:0;color:var(--suave)}
.login-card .prim{padding:10px}
.link{border:0;background:none;color:var(--acento);padding:2px}
.lerr{margin:0;color:var(--rojo);font-size:13px;min-height:0}
.lerr:empty{display:none}
#loginCargando{color:var(--suave);text-align:center}
#cuentaBtn{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
@media (max-width:600px){header h1{min-width:0;font-size:19px}header{padding:12px}main{padding:0 12px 12px}#tareas{padding:0 12px 20px}.dsem button{width:32px;height:32px}.dsem .t-todos{padding:0 8px}#cuentaBtn{max-width:150px}}
.tabs{display:flex;background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:600;color:var(--suave)}
.tabs button.on{background:var(--acento);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
.badge:empty{display:none}
.tabs button.on .badge{background:#fff;color:var(--acento)}
#tareas{display:none;flex:1;padding:0 18px 24px}
body.v-tareas main,body.v-tareas .calctl{display:none!important}
body.v-tareas #tareas{display:block}
.t-wrap{max-width:720px;margin:0 auto;display:grid;gap:12px}
.t-nueva{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:12px;display:grid;gap:10px}
.t-fila{display:flex;gap:8px}
.t-fila input{flex:1;min-width:0;font-size:15px}
.t-opc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--suave)}
.t-opc label{display:flex;align-items:center;gap:6px}
.t-opc input[type=date]{padding:5px 8px}
.dsem .t-todos{width:auto;border-radius:17px;padding:0 10px;font-size:12px}
.t-prog{display:grid;gap:6px}
.t-prog .barra{height:8px;background:var(--borde);border-radius:4px;overflow:hidden}
.t-prog .barra i{display:block;height:100%;background:#30a46c;border-radius:4px;transition:width .3s}
.t-prog small{color:var(--suave)}
.t-wrap h2{font-size:16px;margin:8px 0 -4px;display:flex;align-items:center;justify-content:space-between}
.t-wrap h2 button{font-size:12px;padding:3px 10px;font-weight:400}
.t-ed{border:0;background:none;color:var(--suave);padding:4px 8px;font-size:15px}
.t-item b{white-space:normal!important}
.item.atrasada small{color:var(--rojo);font-weight:600}
.item.rutina{cursor:default}
.chk.vacio{visibility:hidden}
@media (max-width:900px){body{height:auto;min-height:100vh}main{flex-direction:column}aside{width:auto}#cal{min-height:460px}#listaDia,#listaProx{max-height:none;flex:none}}
</style>
</head>
<body>
<header>
  <nav class="tabs"><button data-vista="cal" class="on">📅 Calendario</button><button data-vista="tareas">✅ Tareas<span class="badge" id="tBadge"></span></button></nav>
  <button class="nav calctl" id="prev" title="Mes anterior">‹</button>
  <button class="nav calctl" id="next" title="Mes siguiente">›</button>
  <h1 id="mes" class="calctl"></h1>
  <button id="hoyBtn" class="calctl">Hoy</button>
  <div class="esp"></div>
  <button id="notiBtn">🔔 Activar avisos</button>
  <button id="cuentaBtn" hidden title="Tu cuenta"></button>
  <button class="prim calctl" id="nuevoBtn">+ Nuevo</button>
</header>
<div id="aviso"><span id="avisoTxt"></span><button id="avisoX">Vale</button></div>
<main>
  <div id="cal"></div>
  <aside>
    <h2 id="tituloDia"></h2>
    <div class="lista" id="listaDia"></div>
    <h2>Próximos 7 días</h2>
    <div class="lista" id="listaProx"></div>
    <div class="pie">
      <button id="exportar" title="Guarda una copia de seguridad de todo">💾 Copia de seguridad</button>
      <button id="importar">📂 Restaurar copia</button>
      <input type="file" id="fichero" accept=".json" hidden>
    </div>
  </aside>
</main>

<section id="tareas"><div class="t-wrap">
  <form class="t-nueva" id="tForm">
    <div class="t-fila"><input id="tTexto" placeholder="Añadir tarea… (ej. Poner lavadora)" maxlength="140" autocomplete="off"><button class="prim">Añadir</button></div>
    <div class="t-opc">
      <span>Repetir:</span><div class="dsem" id="tDias"></div>
      <label id="tFechaWrap">o para el día <input type="date" id="tFecha"></label>
    </div>
  </form>
  <div class="t-prog" id="tProg"></div>
  <h2>Hoy</h2><div class="lista" id="tHoy"></div>
  <div id="tProxBloque"><h2>Más adelante</h2><div class="lista" id="tProx"></div></div>
  <div id="tRutBloque"><h2>Tareas que se repiten</h2><div class="lista" id="tRut"></div></div>
  <div id="tHechasBloque"><h2>Hechas <button type="button" id="tLimpiar">Borrar hechas</button></h2><div class="lista" id="tHechas"></div></div>
</div></section>

<dialog id="dlgT">
  <form method="dialog" id="teForm">
    <h3>Editar tarea</h3>
    <label>Tarea<input id="teTexto" required maxlength="140"></label>
    <div class="dias-sel">Repetir (si no marcas ningún día, es de una sola vez):<div class="dsem" id="teDias"></div></div>
    <label id="teFechaWrap">Para el día (opcional)<input type="date" id="teFecha"></label>
    <div class="acciones">
      <button type="button" class="peligro" id="teBorrar">Eliminar</button>
      <div class="esp"></div>
      <button type="button" id="teCancelar">Cancelar</button>
      <button class="prim" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<div class="login" id="login">
  <div id="loginCargando">Cargando…</div>
  <form class="login-card" id="loginForm" hidden>
    <h2>📅 Mi Agenda</h2>
    <p class="sub" id="loginSub">Entra con tu cuenta para tener la misma agenda en el PC y en el móvil.</p>
    <label>Email<input type="email" id="lEmail" required autocomplete="email"></label>
    <label>Contraseña<input type="password" id="lPass" required minlength="6" autocomplete="current-password"></label>
    <p class="lerr" id="lErr"></p>
    <button class="prim" id="lEntrar">Entrar</button>
    <button type="button" id="lModo">¿No tienes cuenta? Crea una</button>
    <button type="button" class="link" id="lOlvido">¿Has olvidado la contraseña?</button>
  </form>
</div>
<div id="toast" hidden></div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitulo">Nuevo</h3>
    <label>Título<input id="fTitulo" required maxlength="120" placeholder="Ej.: Entrega memoria TFG, Entreno de vóley…"></label>
    <label>Tipo<div class="tipos" id="fTipos"></div></label>
    <div class="fila">
      <label><span id="lblFecha">Fecha</span><input type="date" id="fFecha" required></label>
      <label>Hora (opcional)<input type="time" id="fHora"></label>
      <label>Avisar desde<select id="fAntelacion">
        <option value="7">7 días antes</option><option value="3">3 días antes</option>
        <option value="1">1 día antes</option><option value="0">El mismo día</option>
      </select></label>
    </div>
    <div class="rep">
      <label class="chkl"><input type="checkbox" id="fRepite"> 🔁 Se repite cada semana</label>
      <div id="fRepOpc" class="dias-sel" hidden>
        Qué días:
        <div class="dsem" id="fDias"></div>
        <label>Hasta (opcional, vacío = siempre)<input type="date" id="fHasta"></label>
      </div>
    </div>
    <label>Notas<textarea id="fNotas" placeholder="Detalles, enlace, sala…"></textarea></label>
    <div class="acciones">
      <button type="button" class="peligro" id="borrar">Eliminar</button>
      <button type="button" class="peligro" id="borrarDia" hidden>Quitar solo este día</button>
      <div class="esp"></div>
      <button type="button" id="cancelar">Cancelar</button>
      <button class="prim" id="guardar" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<script>
const TIPOS={"Entrega":"#e5484d","Reunión":"#3e63dd","Examen":"#8e4ec6","Tarea":"#f76b15","Deporte":"#12a594","Otro":"#30a46c"};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DIAS_L=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const SEM=[[1,"L"],[2,"M"],[3,"X"],[4,"J"],[5,"V"],[6,"S"],[0,"D"]]; // getDay() + letra
const K_EV="miAgenda.eventos", K_AV="miAgenda.avisos";
const $=id=>document.getElementById(id);

// ---------- almacenamiento
function cargar(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
function guardarK(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("No se pudo guardar: "+e.message)}}
let eventos=[]; // llegan de la nube (ver módulo Firebase al final)
const guardar=()=>window.nube?.guardar(eventos);
window.setEventos=arr=>{eventos=arr;refrescar();comprobarAvisos()};
function toast(t,ms=4000){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms)}

// ---------- fechas
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const deIso=s=>{const[a,m,d]=s.split("-").map(Number);return new Date(a,m-1,d)};
const hoy=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const masDias=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const diasHasta=s=>Math.round((deIso(s)-hoy())/864e5);
const bonita=s=>{const d=deIso(s);return `${DIAS_L[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
function restante(n){
  if(n===0)return"Es hoy";if(n===1)return"Es mañana";if(n>1)return`Quedan ${n} días`;
  if(n===-1)return"Fue ayer";return`Hace ${-n} días`;
}
const color=e=>TIPOS[e.tipo]||TIPOS.Otro;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const porHora=(a,b)=>(a.ev.hora||"99").localeCompare(b.ev.hora||"99");
function textoRep(e){
  if(!e.rep)return"";
  const ds=SEM.filter(([n])=>e.rep.dias.includes(n)).map(([n])=>DIAS_L[n]);
  let t=ds.length===7?"todos los días":"cada "+(ds.length>1?ds.slice(0,-1).join(", ")+" y "+ds.at(-1):ds[0]);
  if(e.rep.hasta)t+=` hasta el ${deIso(e.rep.hasta).getDate()} de ${MESES[deIso(e.rep.hasta).getMonth()]}`;
  return t;
}

// ---------- ocurrencias (eventos normales + los que se repiten)
function instancias(desde,hasta){
  const out=[];
  for(const e of eventos){
    if(!e.rep){if(e.fecha>=desde&&e.fecha<=hasta)out.push({ev:e,fecha:e.fecha,hecho:!!e.hecho});continue}
    const ini=e.fecha>desde?e.fecha:desde;
    const fin=e.rep.hasta&&e.rep.hasta<hasta?e.rep.hasta:hasta;
    for(let d=deIso(ini);iso(d)<=fin;d.setDate(d.getDate()+1)){
      const k=iso(d);
      if(e.rep.dias.includes(d.getDay())&&!(e.excl||[]).includes(k))
        out.push({ev:e,fecha:k,hecho:!!(e.hechos||{})[k]});
    }
  }
  return out;
}

let vista=new Date(); vista.setDate(1);
let sel=iso(hoy());

// ---------- calendario
function dibujar(){
  $("mes").textContent=MESES[vista.getMonth()][0].toUpperCase()+MESES[vista.getMonth()].slice(1)+" "+vista.getFullYear();
  const cal=$("cal"); cal.innerHTML=DIAS.map(d=>`<div class="cab">${d}</div>`).join("");
  const ini=new Date(vista); ini.setDate(1-((vista.getDay()+6)%7));
  const fin=new Date(vista.getFullYear(),vista.getMonth()+1,0);
  const semanas=Math.ceil(((fin-ini)/864e5+1)/7);
  cal.style.gridTemplateRows=`auto repeat(${semanas},1fr)`;
  const porDia={}; instancias(iso(ini),iso(masDias(ini,semanas*7-1))).forEach(i=>(porDia[i.fecha]??=[]).push(i));
  const h=iso(hoy());
  for(let n=0;n<semanas*7;n++){
    const d=masDias(ini,n); const k=iso(d);
    const evs=(porDia[k]||[]).sort((a,b)=>(a.hecho-b.hecho)||porHora(a,b));
    const div=document.createElement("div");
    div.className="dia"+(d.getMonth()!==vista.getMonth()?" fuera":"")+(k===h?" hoy":"")+(k===sel?" sel":"");
    div.innerHTML=`<span class="num">${d.getDate()}</span>`+
      evs.slice(0,3).map(i=>`<div class="ev${i.hecho?" hecho":""}" style="background:${color(i.ev)}" title="${esc(i.ev.titulo)}">${i.ev.rep?'<span class="rec">↻</span>':""}${i.ev.hora?i.ev.hora+" ":""}${esc(i.ev.titulo)}</div>`).join("")+
      (evs.length>3?`<div class="mas">+${evs.length-3} más</div>`:"");
    div.onclick=()=>{sel=k;if(d.getMonth()!==vista.getMonth()){vista=new Date(d.getFullYear(),d.getMonth(),1)}refrescar()};
    div.ondblclick=()=>abrir(null,k);
    cal.appendChild(div);
  }
}

function itemHTML(i,sub,clase=""){
  const e=i.ev;
  return `<div class="item ${i.hecho?"hecho":""} ${clase}" data-id="${e.id}" data-f="${i.fecha}">
    <button class="chk ${i.hecho?"on":""}" data-chk="${e.id}|${i.fecha}" title="Marcar como hecho">${i.hecho?"✓":""}</button>
    <span class="punto" style="background:${color(e)}"></span>
    <div class="t"><b>${e.rep?'<span class="rec">↻</span>':""}${esc(e.titulo)}</b><small>${sub}</small></div></div>`;
}

function listas(){
  $("tituloDia").textContent=bonita(sel).replace(/^./,c=>c.toUpperCase());
  const delDia=instancias(sel,sel).sort(porHora);
  $("listaDia").innerHTML=delDia.length?delDia.map(i=>itemHTML(i,`${i.ev.tipo}${i.ev.hora?" · "+i.ev.hora:""}${i.ev.rep?" · "+textoRep(i.ev):""}`)).join("")
    :`<div class="vacio">Nada este día.<br><button class="prim" onclick="abrir(null,sel)" style="margin-top:8px">+ Añadir</button></div>`;
  const prox=instancias(iso(masDias(hoy(),-7)),iso(masDias(hoy(),7)))
    .filter(i=>!i.hecho&&(!i.ev.rep||diasHasta(i.fecha)>=0))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||porHora(a,b));

}

function abrir(e,fecha,ocu){

$("form").onsubmit=ev=>{
  const t=$("fTitulo").value.trim(), f=$("fFecha").value, rep=$("fRepite").checked, hasta=$("fHasta").value;
  if(!t||!f){ev.preventDefault();return}
  if(rep&&!diasSel.length){ev.preventDefault();alert("Elige al menos un día de la semana.");return}
  if(rep&&hasta&&hasta<f){ev.preventDefault();alert("La fecha «Hasta» tiene que ser posterior al inicio.");return}
  const datos={titulo:t,tipo:tipoSel,fecha:f,hora:$("fHora").value,antelacion:Number($("fAntelacion").value),notas:$("fNotas").value.trim()};
  if(rep)datos.rep={dias:[...diasSel].sort(),hasta};
  if(editando){
    let cur=eventos.find(x=>x.id===editando.id);
    if(!cur){cur=editando;eventos.push(cur)}
    Object.assign(cur,datos);
    if(!rep){delete cur.rep;delete cur.hechos;delete cur.excl}
  } else eventos.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random(),hecho:false,...datos});

function comprobarAvisos(forzar=false){
  const h=iso(hoy()), av=cargar(K_AV,{});
  const pend=instancias(h,iso(masDias(hoy(),7)))
    .filter(i=>!i.hecho&&diasHasta(i.fecha)<=(i.ev.antelacion??7))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||porHora(a,b));
  const clave=i=>i.ev.id+"|"+i.fecha;
  if(pend.length){
    $("avisoTxt").innerHTML=`⏰ <b>${pend.length===1?"Tienes 1 cosa":"Tienes "+pend.length+" cosas"} en los próximos días:</b> `+
      pend.slice(0,4).map(i=>`${esc(i.ev.titulo)} (${restante(diasHasta(i.fecha)).toLowerCase()})`).join(" · ")+(pend.length>4?" …":"");
    if(sessionStorage.getItem("avisoCerrado")!==h)$("aviso").classList.add("on");
  } else $("aviso").classList.remove("on");
  const nuevos=pend.filter(i=>forzar||av[clave(i)]!==h);
  if(!nuevos.length||!("Notification" in window)||Notification.permission!=="granted")return;
  const lanzar=(t,b)=>{try{const n=new Notification(t,{body:b,requireInteraction:true,tag:"miagenda-"+t});n.onclick=()=>{window.focus();n.close()}}catch{}};
  if(nuevos.length<=3) nuevos.forEach(i=>lanzar(`${i.ev.tipo}: ${i.ev.titulo}`,`${restante(diasHasta(i.fecha))} (${bonita(i.fecha)}${i.ev.hora?", "+i.ev.hora:""})`));
  else lanzar(`Tienes ${nuevos.length} cosas esta semana`,nuevos.slice(0,6).map(i=>`• ${i.ev.titulo}: ${restante(diasHasta(i.fecha)).toLowerCase()}`).join("\n"));
  nuevos.forEach(i=>av[clave(i)]=h);
  Object.keys(av).forEach(k=>{if(av[k]!==h)delete av[k]});
  guardarK(K_AV,av);
}

// ---------- tareas (checklist)
let tareas=[];

const nuevoId=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random();
function diasTxt(d){
  if(d.length===7)return"Todos los días";
  if(d.length===5&&[1,2,3,4,5].every(x=>d.includes(x)))return"De lunes a viernes";
  if(d.length===2&&d.includes(0)&&d.includes(6))return"Fines de semana";
  return SEM.filter(([n])=>d.includes(n)).map(([n])=>DIAS[(n+6)%7]).join(", ");
}
const esRutina=t=>!!(t.dias&&t.dias.length);
function hechaHoy(t){return esRutina(t)?!!(t.hechos||{})[iso(hoy())]:!!t.hecha}
function tItem(t,sub,{cl="",chk=true}={}){
  const done=chk&&hechaHoy(t);
  return `<div class="item t-item ${done?"hecho":""} ${cl}" data-tid="${t.id}">
    <button class="chk ${done?"on":""} ${chk?"":"vacio"}" data-tchk="${t.id}" title="Marcar como hecha">${done?"✓":""}</button>
    <div class="t"><b>${esc(t.texto)}</b>${sub?`<small>${sub}</small>`:""}</div>
    <button class="t-ed" data-ted="${t.id}" title="Editar">✎</button></div>`;
}
function dibujarTareas(){
  if(!$("tHoy"))return;
  const h=iso(hoy()), dHoy=hoy().getDay();
  const enHoy=[], prox=[], rut=[], hechas=[];
  for(const t of tareas){
    if(esRutina(t)){rut.push(t);if(t.dias.includes(dHoy))enHoy.push(t);continue}
    if(t.hecha){(t.hechaEl===h?enHoy:hechas).push(t);continue}
    (!t.fecha||t.fecha<=h?enHoy:prox).push(t);
  }
  const clave=t=>[hechaHoy(t)?1:0, t.fecha&&t.fecha<h&&!esRutina(t)?0:1, t.creada||0];
  enHoy.sort((a,b)=>{const x=clave(a),y=clave(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]});
  const hechasHoy=enHoy.filter(hechaHoy).length;
  $("tHoy").innerHTML=enHoy.length?enHoy.map(t=>{
      let sub="",cl="";
      if(esRutina(t))sub="↻ "+diasTxt(t.dias);
      else if(t.fecha&&t.fecha<h&&!t.hecha){sub=`Atrasada · era para el ${bonita(t.fecha)}`;cl="atrasada"}
      else if(t.fecha===h)sub="Para hoy";
      return tItem(t,sub,{cl});
    }).join(""):`<div class="vacio">Nada para hoy. Escribe arriba tu primera tarea ✍️</div>`;
  $("tProg").innerHTML=enHoy.length?`<div class="barra"><i style="width:${Math.round(hechasHoy/enHoy.length*100)}%"></i></div><small>${hechasHoy===enHoy.length?"¡Todo hecho por hoy! 🎉":`${hechasHoy} de ${enHoy.length} hechas hoy`}</small>`:"";
  prox.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  $("tProxBloque").hidden=!prox.length;
  $("tProx").innerHTML=prox.map(t=>tItem(t,`Para el ${bonita(t.fecha)} · ${restante(diasHasta(t.fecha)).toLowerCase()}`)).join("");
  rut.sort((a,b)=>(a.creada||0)-(b.creada||0));
  $("tRutBloque").hidden=!rut.length;
  $("tRut").innerHTML=rut.map(t=>tItem(t,"↻ "+diasTxt(t.dias)+(t.dias.includes(dHoy)?" · hoy toca":""),{cl:"rutina",chk:false})).join("");
  hechas.sort((a,b)=>(b.hechaEl||"").localeCompare(a.hechaEl||""));
  $("tHechasBloque").hidden=!hechas.length;
  $("tHechas").innerHTML=hechas.slice(0,30).map(t=>tItem(t,t.hechaEl?`Hecha el ${bonita(t.hechaEl)}`:"Hecha")).join("");
  const pend=enHoy.length-hechasHoy; $("tBadge").textContent=pend?String(pend):"";
}
function toggleT(id){

    t.hechos??={}; if(t.hechos[h])delete t.hechos[h]; else t.hechos[h]=true;
    const lim=iso(masDias(hoy(),-60)); for(const k of Object.keys(t.hechos))if(k<lim)delete t.hechos[k];
  } else {t.hecha=!t.hecha; if(t.hecha)t.hechaEl=h; else delete t.hechaEl}
  guardarT(); dibujarTareas();
}

// selector de días reutilizable
function selectorDias(cont,get,set,alCambiar){

  cont.onclick=ev=>{const b=ev.target.closest("[data-d]");if(!b)return;let d=get();
    if(b.dataset.d==="all")d=d.length===7?[]:[1,2,3,4,5,6,0];else{const n=Number(b.dataset.d);d=d.includes(n)?d.filter(x=>x!==n):[...d,n]}
    set(d);pintar()};
  return pintar;
}
let tDiasSel=[];

pintarTDias();
$("tForm").onsubmit=ev=>{
  ev.preventDefault(); const txt=$("tTexto").value.trim(); if(!txt){$("tTexto").focus();return}

let tEditId=null, teDias=[];
const pintarTeDias=selectorDias($("teDias"),()=>teDias,d=>teDias=d,()=>$("teFechaWrap").hidden=teDias.length>0);

$("teCancelar").onclick=()=>$("dlgT").close();
$("teBorrar").onclick=()=>{const t=tareas.find(x=>x.id===tEditId);if(t&&confirm(`¿Eliminar la tarea «${t.texto}»?`)){tareas=tareas.filter(x=>x.id!==tEditId);guardarT();$("dlgT").close();dibujarTareas()}};
$("tLimpiar").onclick=()=>{const h=iso(hoy());const n=tareas.filter(t=>!esRutina(t)&&t.hecha&&t.hechaEl!==h).length;
  if(n&&confirm(`¿Borrar ${n===1?"la tarea hecha":"las "+n+" tareas hechas"}?`)){tareas=tareas.filter(t=>!(!esRutina(t)&&t.hecha&&t.hechaEl!==h));guardarT();dibujarTareas()}};

let vistaAct=(()=>{try{return localStorage.getItem("miAgenda.vista")||"cal"}catch{return"cal"}})();

setInterval(()=>{ if(iso(hoy())!==ultimoDia){ultimoDia=iso(hoy());refrescar()} comprobarAvisos() },15*60*1000);
estadoNoti(); refrescar(); setTimeout(comprobarAvisos,800);

  $("loginCargando").hidden=true;
  if(!user){
    uid=null; syncs={eventos:new Map(),tareas:new Map()}; window.setEventos([]); window.setTareas([]);
    $("cuentaBtn").hidden=true; $("login").hidden=false; $("loginForm").hidden=false; $("lPass").value="";
    return;
  }
  uid=user.uid;
  $("login").hidden=true; $("cuentaBtn").hidden=false; $("cuentaBtn").textContent="👤 "+user.email;
  let primera=true;
  unsubs.push(onSnapshot(collection(db,"usuarios",uid,"eventos"),snap=>{
    const arr=snap.docs.map(d=>d.data());
    syncs.eventos=new Map(arr.map(e=>[e.id,JSON.stringify(e)]));
    window.setEventos(arr);
    if(primera){primera=false;migrar(arr)}
  },err=>alert("No se pudo cargar tu agenda: "+err.message)));
  unsubs.push(onSnapshot(collection(db,"usuarios",uid,"tareas"),snap=>{
    const arr=snap.docs.map(d=>d.data());
    syncs.tareas=new Map(arr.map(t=>[t.id,JSON.stringify(t)]));
    window.setTareas(arr);
  },err=>alert("No se pudieron cargar tus tareas: "+err.message)));
});

// ----- formulario de acceso
const ERR={"auth/invalid-credential":"Email o contraseña incorrectos.","auth/wrong-password":"Email o contraseña incorrectos.","auth/user-not-found":"No hay ninguna cuenta con ese email.",
  "auth/email-already-in-use":"Ya existe una cuenta con ese email. Pulsa «¿Ya tienes cuenta? Entra».","auth/weak-password":"La contraseña tiene que tener al menos 6 caracteres.",
  "auth/invalid-email":"Ese email no es válido.","auth/missing-password":"Escribe la contraseña.","auth/too-many-requests":"Demasiados intentos. Espera un momento y vuelve a probar.",
  "auth/network-request-failed":"No hay conexión a internet."};
const msg=e=>ERR[e.code]||e.message;
function modo(){
  $("lEntrar").textContent=registrar?"Crear cuenta":"Entrar";
  $("lModo").textContent=registrar?"¿Ya tienes cuenta? Entra":"¿No tienes cuenta? Crea una";
  $("loginSub").textContent=registrar?"Crea tu cuenta con tu email y una contraseña (mínimo 6 caracteres).":"Entra con tu cuenta para tener la misma agenda en el PC y en el móvil.";
  $("lPass").autocomplete=registrar?"new-password":"current-password";
  $("lOlvido").hidden=registrar; $("lErr").textContent="";
}
$("lModo").onclick=()=>{registrar=!registrar;modo()};
$("loginForm").onsubmit=async ev=>{
  ev.preventDefault(); $("lErr").textContent=""; $("lEntrar").disabled=true;
  const email=$("lEmail").value.trim(), pass=$("lPass").value;
  try{ registrar?await createUserWithEmailAndPassword(auth,email,pass):await signInWithEmailAndPassword(auth,email,pass) }
  catch(e){$("lErr").textContent=msg(e)}
  $("lEntrar").disabled=false;
};
$("lOlvido").onclick=async()=>{
  const email=$("lEmail").value.trim();
  if(!email){$("lErr").textContent="Escribe primero tu email arriba.";return}
  try{await sendPasswordResetEmail(auth,email);$("lErr").textContent="";window.toast?.("Te he enviado un email para cambiar la contraseña (mira también en spam).",7000)}
  catch(e){$("lErr").textContent=msg(e)}
};
$("cuentaBtn").onclick=()=>{if(confirm(`Has entrado como ${auth.currentUser?.email}.\n\n¿Cerrar sesión en este dispositivo?`))signOut(auth)};
modo();
</script>
